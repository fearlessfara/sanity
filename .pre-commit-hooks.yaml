- id: sanity-judge-rules
  name: sanity — natural-language rules
  description: >
    Grades every check:"judge" rule in .sanity/rules against the staged
    change. Needs judge.provider=api (or auto) and an API key. Fails open on
    missing keys, timeouts, or unreadable replies.
  entry: sanity judge --rules
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true

- id: sanity-judge
  name: sanity — commit message vs diff (opt-in)
  description: >
    Asks a model whether the commit message matches the staged diff.
    Off until judge.enabled is true in .sanity/config.json; needs
    judge.provider=api and an API key for commit-msg. Fails open on errors.
  entry: sanity judge --commit
  language: python
  stages: [commit-msg]
