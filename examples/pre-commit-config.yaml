# Written by `sanity init`, or copy this by hand.
# Pin `rev` to a release tag: https://github.com/fearlessfara/sanity/releases
repos:
  - repo: https://github.com/fearlessfara/sanity
    rev: v0.4.1
    hooks:
      - id: sanity-comments
      - id: sanity-rules
      # Optional AI judge (commit-msg). Needs judge.enabled=true and
      # judge.provider=api plus an API key in the environment.
      # - id: sanity-judge
