# Copy to .github/workflows/sanity.yml in the repo you want to guard.
name: sanity

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sanity
        run: pip install git+https://github.com/fearlessfara/sanity.git@v0.6.0

      # Soft-reset against the PR base so the staged diff is the whole change.
      # Needs an API key; fails open when it is missing.
      - name: Natural-language rules
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git reset --soft "origin/${{ github.base_ref }}"
          sanity judge --rules

      - name: Instruction files in sync
        run: sanity sync --check
